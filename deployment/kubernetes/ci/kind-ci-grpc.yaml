---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: arcana-ci-kind-python
  labels:
    app: arcana-cloud-python
    environment: ci

---
# Secret — sensitive values (avoids SonarQube kubernetes:S2068 hotspot)
apiVersion: v1
kind: Secret
metadata:
  name: arcana-ci-secrets
  namespace: arcana-ci-kind-python
type: Opaque
data:
  DATABASE_URL: bXlzcWwrcHlteXNxbDovL2FyY2FuYTpjaV9hcmNhbmFAbXlzcWw6MzMwNi9hcmNhbmFfY2xvdWQ=
stringData:
  DB_PASSWORD: "ci_arcana"
  JWT_SECRET_KEY: "ci-secret-key-minimum-32-characters"
  MYSQL_ROOT_PASSWORD: "ci_root"

---
# ConfigMap — non-sensitive config
apiVersion: v1
kind: ConfigMap
metadata:
  name: arcana-ci-config
  namespace: arcana-ci-kind-python
data:
  FLASK_ENV: "development"
  DEPLOYMENT_MODE: "layered"
  COMMUNICATION_PROTOCOL: "grpc"
  MYSQL_DATABASE: "arcana_cloud"
  MYSQL_USER: "arcana"
  SECRET_KEY: "ci-secret-key"

---
# MySQL Service
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: arcana-ci-kind-python
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306

---
# MySQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: arcana-ci-kind-python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mysql
          image: mysql:8.0
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
              ephemeral-storage: "256Mi"
            limits:
              memory: "1Gi"
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: arcana-ci-config
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: arcana-ci-config
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arcana-ci-secrets
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arcana-ci-secrets
                  key: MYSQL_ROOT_PASSWORD
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-u", "arcana", "-pci_arcana"]
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: arcana-ci-kind-python
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: arcana-ci-kind-python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7-alpine
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "64Mi"
            limits:
              memory: "256Mi"
          ports:
            - containerPort: 6379

---
# Repository Layer Service — gRPC on 50052
apiVersion: v1
kind: Service
metadata:
  name: arcana-ci-repository
  namespace: arcana-ci-kind-python
spec:
  selector:
    app: arcana-ci-repository
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052

---
# Repository Layer Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcana-ci-repository
  namespace: arcana-ci-kind-python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arcana-ci-repository
  template:
    metadata:
      labels:
        app: arcana-ci-repository
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: db-migrate
          image: arcana-cloud-python:ci
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL ..."
              timeout 180 sh -c 'until nc -z mysql 3306; do sleep 2; done'
              sleep 5
              echo "MySQL is reachable, creating tables ..."
              python -c "
              import os
              os.environ['DEPLOYMENT_MODE'] = 'monolithic'
              os.environ['DEPLOYMENT_LAYER'] = 'monolithic'
              from app import create_app
              from app.extensions import db
              app = create_app('development')
              with app.app_context():
                  db.create_all()
                  print('DB tables created successfully')
              "
              echo "Init container done"
          env:
            - name: FLASK_ENV
              valueFrom:
                configMapKeyRef:
                  name: arcana-ci-config
                  key: FLASK_ENV
            - name: DEPLOYMENT_MODE
              value: "monolithic"
            - name: DEPLOYMENT_LAYER
              value: "monolithic"
            - name: SECRET_KEY
              valueFrom:
                configMapKeyRef:
                  name: arcana-ci-config
                  key: SECRET_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: arcana-ci-secrets
                  key: JWT_SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: arcana-ci-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              value: "redis://redis:6379/0"
      containers:
        - name: repository
          image: arcana-cloud-python:ci
          imagePullPolicy: Never
          command: ["/app/docker/entrypoint-repository.sh"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
              ephemeral-storage: "128Mi"
            limits:
              memory: "512Mi"
          ports:
            - name: grpc
              containerPort: 50052
          env:
            - name: FLASK_ENV
              valueFrom:
                configMapKeyRef:
                  name: arcana-ci-config
                  key: FLASK_ENV
            - name: DEPLOYMENT_MODE
              valueFrom:
                configMapKeyRef:
                  name: arcana-ci-config
                  key: DEPLOYMENT_MODE
            - name: COMMUNICATION_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: arcana-ci-config
                  key: COMMUNICATION_PROTOCOL
            - name: DEPLOYMENT_LAYER
              value: "repository"
            - name: GRPC_PORT
              value: "50052"
            - name: SERVICE_PORT
              value: "5002"
            - name: SERVICE_NAME
              value: "arcana-cloud-repository"
            - name: SECRET_KEY
              valueFrom:
                configMapKeyRef:
                  name: arcana-ci-config
                  key: SECRET_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: arcana-ci-secrets
                  key: JWT_SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: arcana-ci-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              value: "redis://redis:6379/0"
          readinessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 45
            periodSeconds: 15

---
# Service Layer Service — gRPC on 50051
apiVersion: v1
kind: Service
metadata:
  name: arcana-ci-service
  namespace: arcana-ci-kind-python
spec:
  selector:
    app: arcana-ci-service
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051

---
# Service Layer Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcana-ci-service
  namespace: arcana-ci-kind-python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arcana-ci-service
  template:
    metadata:
      labels:
        app: arcana-ci-service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: service
          image: arcana-cloud-python:ci
          imagePullPolicy: Never
          command: ["/app/docker/entrypoint-service.sh"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
              ephemeral-storage: "128Mi"
            limits:
              memory: "512Mi"
          ports:
            - name: grpc
              containerPort: 50051
          env:
            - name: FLASK_ENV
              valueFrom:
                configMapKeyRef:
                  name: arcana-ci-config
                  key: FLASK_ENV
            - name: DEPLOYMENT_MODE
              valueFrom:
                configMapKeyRef:
                  name: arcana-ci-config
                  key: DEPLOYMENT_MODE
            - name: COMMUNICATION_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: arcana-ci-config
                  key: COMMUNICATION_PROTOCOL
            - name: DEPLOYMENT_LAYER
              value: "service"
            - name: GRPC_PORT
              value: "50051"
            - name: SERVICE_NAME
              value: "arcana-cloud-service"
            - name: USER_REPO_URLS
              value: "arcana-ci-repository:50052"
            - name: SECRET_KEY
              valueFrom:
                configMapKeyRef:
                  name: arcana-ci-config
                  key: SECRET_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: arcana-ci-secrets
                  key: JWT_SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: arcana-ci-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              value: "redis://redis:6379/0"
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 45
            periodSeconds: 15

---
# Controller Layer Service — NodePort 30095
apiVersion: v1
kind: Service
metadata:
  name: arcana-ci-controller
  namespace: arcana-ci-kind-python
spec:
  type: NodePort
  selector:
    app: arcana-ci-controller
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30095

---
# Controller Layer Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcana-ci-controller
  namespace: arcana-ci-kind-python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arcana-ci-controller
  template:
    metadata:
      labels:
        app: arcana-ci-controller
    spec:
      automountServiceAccountToken: false
      containers:
        - name: controller
          image: arcana-cloud-python:ci
          imagePullPolicy: Never
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
              ephemeral-storage: "128Mi"
            limits:
              memory: "512Mi"
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: FLASK_ENV
              valueFrom:
                configMapKeyRef:
                  name: arcana-ci-config
                  key: FLASK_ENV
            - name: DEPLOYMENT_MODE
              valueFrom:
                configMapKeyRef:
                  name: arcana-ci-config
                  key: DEPLOYMENT_MODE
            - name: COMMUNICATION_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: arcana-ci-config
                  key: COMMUNICATION_PROTOCOL
            - name: DEPLOYMENT_LAYER
              value: "controller"
            - name: PORT
              value: "5000"
            - name: SERVICE_NAME
              value: "arcana-cloud-controller"
            - name: USER_SERVICE_URLS
              value: "arcana-ci-service:50051"
            - name: AUTH_SERVICE_URLS
              value: "arcana-ci-service:50051"
            - name: SECRET_KEY
              valueFrom:
                configMapKeyRef:
                  name: arcana-ci-config
                  key: SECRET_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: arcana-ci-secrets
                  key: JWT_SECRET_KEY
            - name: REDIS_URL
              value: "redis://redis:6379/0"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 45
            periodSeconds: 15
