# ============================================================================
# Arcana Cloud - Deployment Configuration
# ============================================================================
# This configuration file defines how the application components are deployed
# across different deployment modes: monolithic, layered, and microservices
# ============================================================================

# Global Configuration
global:
  project_name: arcana-cloud
  version: "1.0.0"
  registry: docker.io/arcanacloud  # Docker registry URL
  namespace: arcana-cloud  # Kubernetes namespace

  # Common environment variables for all deployments
  environment:
    FLASK_ENV: production
    LOG_LEVEL: INFO
    LOG_FORMAT: json
    PYTHONUNBUFFERED: "1"

  # External dependencies
  dependencies:
    database:
      enabled: true
      type: mysql
      version: "8.0"
      host: mysql-service
      port: 3306
      name: arcana_cloud

    redis:
      enabled: true
      version: "7.0"
      host: redis-service
      port: 6379

    celery:
      enabled: true
      broker: redis://redis-service:6379/0
      backend: redis://redis-service:6379/0

# ============================================================================
# Deployment Modes
# ============================================================================

deployment_modes:

  # --------------------------------------------------------------------------
  # MONOLITHIC MODE
  # All components (controllers, services, repositories) in single container
  # --------------------------------------------------------------------------
  monolithic:
    enabled: true
    description: "Single container with all application layers"

    containers:
      app:
        name: arcana-cloud-monolithic
        dockerfile: docker/Dockerfile.monolithic
        port: 5000
        replicas: 3

        # Components included in this container
        components:
          controllers:
            - AuthController
            - UserController
          services:
            - AuthServiceImpl
            - UserServiceImpl
          repositories:
            - UserRepositoryImpl
            - OAuthTokenRepositoryImpl

        # Environment variables specific to this mode
        environment:
          DEPLOYMENT_LAYER: monolithic
          SERVICE_NAME: arcana-cloud-monolithic
          SERVICE_PORT: 5000

        # Resource limits
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"

        # Health checks
        health_checks:
          liveness:
            path: /health
            port: 5000
            initial_delay: 30
            period: 10
            timeout: 5
            failure_threshold: 3
          readiness:
            path: /ready
            port: 5000
            initial_delay: 10
            period: 5
            timeout: 3
            failure_threshold: 3

        # Auto-scaling configuration
        autoscaling:
          enabled: true
          min_replicas: 2
          max_replicas: 10
          target_cpu_utilization: 70
          target_memory_utilization: 80

  # --------------------------------------------------------------------------
  # LAYERED MODE
  # Separation into Controller, Service, and Repository layers
  # --------------------------------------------------------------------------
  layered:
    enabled: true
    description: "Three-tier architecture with separate containers per layer"

    containers:
      # Controller Layer (API Gateway)
      controller:
        name: arcana-cloud-controller
        dockerfile: docker/Dockerfile.controller
        port: 5000
        replicas: 3

        components:
          controllers:
            - AuthController
            - UserController

        environment:
          DEPLOYMENT_LAYER: controller
          SERVICE_NAME: arcana-cloud-controller
          SERVICE_PORT: 5000
          # Service discovery URLs
          USER_SERVICE_URLS: http://service-layer:5001
          AUTH_SERVICE_URLS: http://service-layer:5001

        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        health_checks:
          liveness:
            path: /health
            port: 5000
            initial_delay: 20
            period: 10
          readiness:
            path: /ready
            port: 5000
            initial_delay: 10
            period: 5

        autoscaling:
          enabled: true
          min_replicas: 2
          max_replicas: 10
          target_cpu_utilization: 70

      # Service Layer (Business Logic)
      service:
        name: arcana-cloud-service
        dockerfile: docker/Dockerfile.service
        port: 5001
        replicas: 3

        components:
          services:
            - AuthServiceImpl
            - UserServiceImpl

        environment:
          DEPLOYMENT_LAYER: service
          SERVICE_NAME: arcana-cloud-service
          SERVICE_PORT: 5001
          # Repository discovery URLs
          USER_REPO_URLS: http://repository-layer:5002

        resources:
          requests:
            cpu: "300m"
            memory: "384Mi"
          limits:
            cpu: "750m"
            memory: "768Mi"

        health_checks:
          liveness:
            path: /health
            port: 5001
            initial_delay: 20
            period: 10
          readiness:
            path: /ready
            port: 5001
            initial_delay: 10
            period: 5

        autoscaling:
          enabled: true
          min_replicas: 2
          max_replicas: 8
          target_cpu_utilization: 70

      # Repository Layer (Data Access)
      repository:
        name: arcana-cloud-repository
        dockerfile: docker/Dockerfile.repository
        port: 5002
        replicas: 2

        components:
          repositories:
            - UserRepositoryImpl
            - OAuthTokenRepositoryImpl

        environment:
          DEPLOYMENT_LAYER: repository
          SERVICE_NAME: arcana-cloud-repository
          SERVICE_PORT: 5002

        resources:
          requests:
            cpu: "400m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"

        health_checks:
          liveness:
            path: /health
            port: 5002
            initial_delay: 30
            period: 10
          readiness:
            path: /ready
            port: 5002
            initial_delay: 15
            period: 5

        autoscaling:
          enabled: true
          min_replicas: 2
          max_replicas: 6
          target_cpu_utilization: 70

  # --------------------------------------------------------------------------
  # MICROSERVICES MODE
  # Full microservices with separate containers for each domain service
  # --------------------------------------------------------------------------
  microservices:
    enabled: true
    description: "Fine-grained microservices architecture"

    containers:
      # Auth Microservice
      auth_service:
        name: arcana-cloud-auth
        dockerfile: docker/Dockerfile.microservice.auth
        port: 5010
        replicas: 3

        components:
          controllers:
            - AuthController
          services:
            - AuthServiceImpl
          repositories:
            - OAuthTokenRepositoryImpl

        environment:
          DEPLOYMENT_LAYER: microservice
          SERVICE_NAME: arcana-cloud-auth
          SERVICE_PORT: 5010
          MICROSERVICE_DOMAIN: auth
          USER_SERVICE_URL: http://user-service:5011

        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        health_checks:
          liveness:
            path: /health
            port: 5010
            initial_delay: 20
            period: 10
          readiness:
            path: /ready
            port: 5010
            initial_delay: 10
            period: 5

        autoscaling:
          enabled: true
          min_replicas: 2
          max_replicas: 8
          target_cpu_utilization: 70

      # User Microservice
      user_service:
        name: arcana-cloud-user
        dockerfile: docker/Dockerfile.microservice.user
        port: 5011
        replicas: 3

        components:
          controllers:
            - UserController
          services:
            - UserServiceImpl
          repositories:
            - UserRepositoryImpl

        environment:
          DEPLOYMENT_LAYER: microservice
          SERVICE_NAME: arcana-cloud-user
          SERVICE_PORT: 5011
          MICROSERVICE_DOMAIN: user
          AUTH_SERVICE_URL: http://auth-service:5010

        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        health_checks:
          liveness:
            path: /health
            port: 5011
            initial_delay: 20
            period: 10
          readiness:
            path: /ready
            port: 5011
            initial_delay: 10
            period: 5

        autoscaling:
          enabled: true
          min_replicas: 2
          max_replicas: 8
          target_cpu_utilization: 70

# ============================================================================
# Network Configuration
# ============================================================================

networking:
  # Service mesh configuration (e.g., Istio, Linkerd)
  service_mesh:
    enabled: false
    provider: istio

  # Load balancing
  load_balancing:
    algorithm: round_robin  # round_robin, least_connections, ip_hash
    session_affinity: false

  # Service discovery
  service_discovery:
    type: kubernetes  # kubernetes, consul, eureka

  # Ingress configuration
  ingress:
    enabled: true
    class: nginx
    hostname: api.arcana-cloud.com
    tls:
      enabled: true
      secret_name: arcana-cloud-tls
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/rate-limit: "100"

# ============================================================================
# Storage Configuration
# ============================================================================

storage:
  # Persistent volume claims
  persistent_volumes:
    uploads:
      enabled: true
      size: 10Gi
      storage_class: standard
      access_mode: ReadWriteMany
      mount_path: /app/uploads

  # Shared cache
  cache:
    enabled: true
    type: redis
    size: 5Gi

# ============================================================================
# Monitoring & Observability
# ============================================================================

monitoring:
  # Prometheus metrics
  prometheus:
    enabled: true
    port: 9090
    path: /metrics
    scrape_interval: 15s

  # Distributed tracing
  tracing:
    enabled: true
    provider: jaeger  # jaeger, zipkin, datadog
    endpoint: http://jaeger-collector:14268/api/traces

  # Logging
  logging:
    enabled: true
    aggregator: fluentd  # fluentd, logstash, loki
    level: INFO

  # APM (Application Performance Monitoring)
  apm:
    enabled: false
    provider: datadog  # datadog, newrelic, elastic

# ============================================================================
# Security Configuration
# ============================================================================

security:
  # Pod security policies
  pod_security:
    run_as_non_root: true
    read_only_root_filesystem: false
    allow_privilege_escalation: false

  # Network policies
  network_policies:
    enabled: true
    default_deny: true

  # Secrets management
  secrets:
    provider: kubernetes  # kubernetes, vault, aws-secrets-manager
    encryption_at_rest: true

  # RBAC (Role-Based Access Control)
  rbac:
    enabled: true
    service_account: arcana-cloud-sa

# ============================================================================
# CI/CD Configuration
# ============================================================================

ci_cd:
  # Build configuration
  build:
    docker_build_args:
      PYTHON_VERSION: "3.14.0"
      BUILD_DATE: "${BUILD_DATE}"
      VCS_REF: "${GIT_COMMIT}"

  # Deployment strategy
  deployment_strategy:
    type: RollingUpdate  # RollingUpdate, Recreate, BlueGreen, Canary
    rolling_update:
      max_surge: 1
      max_unavailable: 0

  # Canary deployment
  canary:
    enabled: false
    steps:
      - weight: 10
        pause_duration: 300
      - weight: 25
        pause_duration: 300
      - weight: 50
        pause_duration: 600
      - weight: 75
        pause_duration: 300

# ============================================================================
# Environment-Specific Overrides
# ============================================================================

environments:
  # Development environment
  development:
    global:
      environment:
        FLASK_ENV: development
        LOG_LEVEL: DEBUG
    networking:
      ingress:
        hostname: dev-api.arcana-cloud.local
        tls:
          enabled: false
    monitoring:
      prometheus:
        enabled: false
      tracing:
        enabled: false

  # Staging environment
  staging:
    global:
      environment:
        FLASK_ENV: staging
        LOG_LEVEL: INFO
    networking:
      ingress:
        hostname: staging-api.arcana-cloud.com
    deployment_modes:
      monolithic:
        containers:
          app:
            replicas: 2
            autoscaling:
              max_replicas: 5

  # Production environment
  production:
    global:
      environment:
        FLASK_ENV: production
        LOG_LEVEL: WARNING
    networking:
      ingress:
        hostname: api.arcana-cloud.com
      service_mesh:
        enabled: true
    security:
      network_policies:
        enabled: true
        default_deny: true
    monitoring:
      apm:
        enabled: true
