# ============================================================================
# Arcana Cloud - Testing Environment (Layered Mode)
# ============================================================================
# Lightweight Docker Compose for running integration tests
# Uses SQLite instead of MySQL for faster test execution
# ============================================================================

services:
  # ============================================================================
  # Controller Layer (API Gateway)
  # ============================================================================
  controller-layer:
    build:
      context: .
      dockerfile: Dockerfile.test
    image: arcanacloud/arcana-cloud-test:latest
    command: python app/controller_server.py
    ports:
      - "5000:5000"
    environment:
      # Flask Configuration
      FLASK_ENV: testing
      SECRET_KEY: test-secret-key
      TESTING: "true"

      # Deployment Configuration
      DEPLOYMENT_MODE: layered
      DEPLOYMENT_LAYER: controller
      SERVICE_NAME: arcana-cloud-controller
      SERVICE_PORT: 5000
      PORT: 5000

      # Service Discovery
      USER_SERVICE_URLS: http://service-layer:5001
      AUTH_SERVICE_URLS: http://service-layer:5001
      SERVICE_URL: http://service-layer:5001

      # JWT Configuration
      JWT_SECRET_KEY: test-jwt-secret
      JWT_ACCESS_TOKEN_EXPIRES: 3600

      # Logging
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: 1
    depends_on:
      service-layer:
        condition: service_healthy
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s

  # ============================================================================
  # Service Layer (Business Logic)
  # ============================================================================
  service-layer:
    build:
      context: .
      dockerfile: Dockerfile.test
    image: arcanacloud/arcana-cloud-test:latest
    command: python app/service_server.py
    ports:
      - "5001:5001"
    environment:
      # Flask Configuration
      FLASK_ENV: testing
      SECRET_KEY: test-secret-key
      TESTING: "true"

      # Deployment Configuration
      DEPLOYMENT_MODE: layered
      DEPLOYMENT_LAYER: service
      SERVICE_NAME: arcana-cloud-service
      SERVICE_PORT: 5001
      PORT: 5001

      # Repository Discovery
      USER_REPO_URLS: http://repository-layer:5002
      REPOSITORY_URL: http://repository-layer:5002

      # Database (passed through for direct access if needed)
      DATABASE_URL: sqlite:////tmp/arcana_test.db

      # Logging
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: 1
    depends_on:
      repository-layer:
        condition: service_healthy
    networks:
      - test-network
    volumes:
      - test-db:/tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s

  # ============================================================================
  # Repository Layer (Data Access with SQLite)
  # ============================================================================
  repository-layer:
    build:
      context: .
      dockerfile: Dockerfile.test
    image: arcanacloud/arcana-cloud-test:latest
    command: python app/repository_server.py
    ports:
      - "5002:5002"
    environment:
      # Flask Configuration
      FLASK_ENV: testing
      SECRET_KEY: test-secret-key
      TESTING: "true"

      # Deployment Configuration
      DEPLOYMENT_MODE: layered
      DEPLOYMENT_LAYER: repository
      SERVICE_NAME: arcana-cloud-repository
      SERVICE_PORT: 5002
      PORT: 5002

      # Database Configuration (SQLite for testing)
      DATABASE_URL: sqlite:////tmp/arcana_test.db

      # Logging
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: 1
    networks:
      - test-network
    volumes:
      - test-db:/tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s

# ============================================================================
# Networks
# ============================================================================
networks:
  test-network:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  test-db:
    driver: local
