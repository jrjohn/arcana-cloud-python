[uwsgi]
# ============================================================================
# Service Layer uWSGI Configuration
# ============================================================================

# Application
module = app.service_server:app
callable = app

# Master process
master = true
enable-threads = true

# Process and threading
processes = 4
threads = 2
thunder-lock = true

# Socket and protocol
http-socket = :5001
protocol = http

# Buffer sizes
buffer-size = 32768
post-buffering = 8192

# Timeouts
socket-timeout = 120
harakiri = 120
harakiri-verbose = true

# Stats and monitoring
stats = :9191
stats-http = true
memory-report = true

# Logging
log-date = %%Y-%%m-%%d %%H:%%M:%%S
log-format = %(addr) - %(user) [%(ltime)] "%(method) %(uri) %(proto)" %(status) %(size) "%(referer)" "%(uagent)" %(msecs)ms
logto = /app/logs/uwsgi.log
logfile-chmod = 644

# Optimization
lazy-apps = true
vacuum = true
die-on-term = true
single-interpreter = true

# Security
uid = 1000
gid = 1000
chmod-socket = 666
no-orphans = true

# Worker management
max-requests = 5000
max-worker-lifetime = 3600
reload-on-rss = 512
worker-reload-mercy = 60

# Python
pythonpath = /app
py-auto-reload = 0
py-autoreload = 0

# Health check
route = ^/health$ donotlog:

# Performance tuning
offload-threads = 4
cheaper-algo = busyness
cheaper = 2
cheaper-initial = 2
cheaper-step = 1
cheaper-overload = 5
