# ============================================================================
# Kubernetes Secrets
# ============================================================================
# Sensitive configuration data (base64 encoded)
# NOTE: In production, use external secret management (e.g., Vault, AWS Secrets Manager)
# ============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: arcana-cloud-secrets
  namespace: arcana-cloud
  labels:
    app: arcana-cloud
    tier: configuration
type: Opaque
data:
  # Secret Key (base64 encoded)
  # Example: echo -n "your-secret-key" | base64
  SECRET_KEY: Y2hhbmdlLXRoaXMtaW4tcHJvZHVjdGlvbi1zZWNyZXQta2V5

  # JWT Secret Key (base64 encoded)
  JWT_SECRET_KEY: and0LXNlY3JldC1rZXktY2hhbmdlLWluLXByb2R1Y3Rpb24=

  # Database Password (base64 encoded)
  # Example: echo -n "arcana_pass" | base64
  DB_PASSWORD: YXJjYW5hX3Bhc3M=

  # Database Root Password (base64 encoded)
  DB_ROOT_PASSWORD: cm9vdF9wYXNzd29yZA==

  # Redis Password (optional, base64 encoded)
  REDIS_PASSWORD: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
  namespace: arcana-cloud
  labels:
    app: mysql
    tier: database
type: Opaque
data:
  # MySQL credentials
  MYSQL_ROOT_PASSWORD: cm9vdF9wYXNzd29yZA==
  MYSQL_USER: YXJjYW5h
  MYSQL_PASSWORD: YXJjYW5hX3Bhc3M=
  MYSQL_DATABASE: YXJjYW5hX2Nsb3Vk

---
# TLS Certificate Secret (for HTTPS)
# This should be created using cert-manager or manually
# Example:
# kubectl create secret tls arcana-cloud-tls \
#   --cert=path/to/tls.crt \
#   --key=path/to/tls.key \
#   -n arcana-cloud
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: arcana-cloud-tls
#   namespace: arcana-cloud
# type: kubernetes.io/tls
# data:
#   tls.crt: <base64-encoded-cert>
#   tls.key: <base64-encoded-key>
