# ============================================================================
# Kubernetes Ingress
# ============================================================================
# Ingress configuration for external HTTP/HTTPS access
# ============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arcana-cloud-ingress
  namespace: arcana-cloud
  labels:
    app: arcana-cloud
  annotations:
    # Nginx Ingress Controller annotations
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "10"

    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"

    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

    # Buffer sizes
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"

    # Session affinity
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "arcana-cloud-session"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";

    # SSL/TLS configuration (if using cert-manager)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    cert-manager.io/acme-challenge-type: http01

spec:
  tls:
    - hosts:
        - api.arcana-cloud.com
        - www.api.arcana-cloud.com
      secretName: arcana-cloud-tls

  rules:
    # Main API domain
    - host: api.arcana-cloud.com
      http:
        paths:
          # API v1 endpoints
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: controller-layer
                port:
                  number: 5000

          # Health check endpoints
          - path: /health
            pathType: Exact
            backend:
              service:
                name: controller-layer
                port:
                  number: 5000

          - path: /ready
            pathType: Exact
            backend:
              service:
                name: controller-layer
                port:
                  number: 5000

          # Metrics endpoint (should be protected in production)
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: controller-layer
                port:
                  number: 9090

    # WWW subdomain (redirect to main domain)
    - host: www.api.arcana-cloud.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: controller-layer
                port:
                  number: 5000

---
# Ingress for internal services (optional - for debugging)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arcana-cloud-internal-ingress
  namespace: arcana-cloud
  labels:
    app: arcana-cloud
    environment: development
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    # Service layer (internal)
    - host: service.arcana-cloud.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: service-layer
                port:
                  number: 5001

    # Repository layer (internal)
    - host: repository.arcana-cloud.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: repository-layer
                port:
                  number: 5002
