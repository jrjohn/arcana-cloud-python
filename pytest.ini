[pytest]
# Pytest 配置文件

# 測試路徑
testpaths = tests

# Python 文件匹配模式
python_files = test_*.py *_test.py

# Python 類匹配模式
python_classes = Test*

# Python 函數匹配模式
python_functions = test_*

# 顯示詳細輸出
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=80

# 標記
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    api: API tests
    database: Database tests
    celery: Celery task tests

# 忽略警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
